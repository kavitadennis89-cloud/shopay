<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopPay - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Shop<span>Pay</span>
        </div>

        <button class="login-btn" id="logoutBtn">
            Logout
        </button>

    </header>


    <main>

        <section class="dashboard-header">

            <h1>Shopkeeper Dashboard</h1>

            <p>
                Manage your shop, orders and payments.
            </p>

        </section>


        <section class="dashboard-grid">

            <div class="dashboard-card">
                <div class="card-icon">📦</div>
                <h2>Products</h2>
                <p id="productsCount">0</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">🛒</div>
                <h2>Orders</h2>
                <p id="ordersCount">0</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">💰</div>
                <h2>Payments</h2>
                <p id="paymentsCount">0</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">👥</div>
                <h2>Customers</h2>
                <p id="customersCount">0</p>
            </div>

        </section>


        <section class="dashboard-actions">

            <h2>Shop Management</h2>

            <div class="action-grid">

                <button>
                    📦 Manage Products
                </button>

                <button>
                    🛒 Manage Orders
                </button>

                <button>
                    💰 Payments
                </button>

                <button>
                    👥 Customers
                </button>

            </div>

        </section>

    </main>


    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDs5gSCW2JwVkuSjiPG2_X81MDZ5tm0s5Y",
            authDomain: "shop-payment-app.firebaseapp.com",
            projectId: "shop-payment-app",
            storageBucket: "shop-payment-app.firebasestorage.app",
            messagingSenderId: "36022696884",
            appId: "1:36022696884:web:6787d79eee07ef210390e1"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        // Protect dashboard
        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href = "login.html";

            }

        });


        // Logout
        document
            .getElementById("logoutBtn")
            .addEventListener("click", async () => {

                await signOut(auth);

                localStorage.removeItem(
                    "shopkeeperLoggedIn"
                );

                window.location.href = "login.html";

            });

    </script>

</body>
</html>
