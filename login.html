<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopPay - Shopkeeper Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        Shop<span>Pay</span>
    </div>

    <a href="index.html" class="login-btn">
        Home
    </a>
</header>


<main class="login-page">

    <div class="login-box">

        <div class="login-icon">🏪</div>

        <h1>Shopkeeper Login</h1>

        <p>Login to manage your shop</p>

        <form id="loginForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter shopkeeper email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                class="start-btn"
                id="loginButton"
            >
                Login
            </button>

            <p id="message"></p>

        </form>

        <p class="signup-text">
            Shopkeeper account only
        </p>

    </div>

</main>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // ==========================
    // SHOPPAY FIREBASE CONFIG
    // ==========================

    const firebaseConfig = {

        apiKey: "WEKA_API_KEY_YAKO_HAPA",

        authDomain: "WEKA_AUTH_DOMAIN_YAKO_HAPA",

        projectId: "WEKA_PROJECT_ID_YAKO_HAPA",

        storageBucket: "WEKA_STORAGE_BUCKET_YAKO_HAPA",

        messagingSenderId: "WEKA_MESSAGING_SENDER_ID_YAKO_HAPA",

        appId: "WEKA_APP_ID_YAKO_HAPA"

    };


    // ==========================
    // FIREBASE
    // ==========================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // ==========================
    // LOGIN
    // ==========================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("loginButton");


            button.disabled = true;
            button.textContent = "Logging in...";

            message.textContent = "";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                // Successful login
                localStorage.setItem(
                    "shopkeeperLoggedIn",
                    "true"
                );


                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Invalid email or password.";

                message.style.color = "red";

                button.disabled = false;

                button.textContent = "Login";

            }

        });

</script>

</body>
</html>
