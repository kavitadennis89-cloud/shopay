<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopPay - Shopkeeper Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        Shop<span>Pay</span>
    </div>

    <a href="index.html" class="login-btn">
        Home
    </a>

</header>


<main class="login-page">

    <div class="login-box">

        <div class="login-icon">🏪</div>

        <h1>Shopkeeper Login</h1>

        <p>Login to manage your shop</p>


        <form id="loginForm" novalidate>

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter shopkeeper email"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="start-btn"
                id="loginButton"
            >
                Login
            </button>

            <p id="message"></p>

        </form>


        <p class="signup-text">
            Shopkeeper account only
        </p>

    </div>

</main>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyDs5gSCW2JwVkuSjiPG2_X81MDZ5tm0s5Y",

        authDomain: "shop-payment-app.firebaseapp.com",

        projectId: "shop-payment-app",

        storageBucket: "shop-payment-app.firebasestorage.app",

        messagingSenderId: "36022696884",

        appId: "1:36022696884:web:6787d79eee07ef210390e1"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            message.style.color = "red";

            return;

        }


        button.disabled = true;

        button.textContent = "Logging in...";

        message.textContent = "";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            localStorage.setItem(
                "shopkeeperLoggedIn",
                "true"
            );


            window.location.href =
                "dashboard.html";


        } catch (error) {

            console.error(error);

            button.disabled = false;

            button.textContent = "Login";


            if (error.code === "auth/invalid-credential") {

                message.textContent =
                    "Wrong email or password.";

            } else if (error.code === "auth/too-many-requests") {

                message.textContent =
                    "Too many attempts. Try again later.";

            } else {

                message.textContent =
                    "Login failed. Please try again.";

            }

            message.style.color = "red";

        }

    });

</script>

</body>
</html>
