<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopPay - Shopkeeper Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Shop<span>Pay</span>
        </div>

        <a href="index.html" class="login-btn">
            Home
        </a>

    </header>


    <main class="login-page">

        <div class="login-box">

            <div class="login-icon">
                🏪
            </div>

            <h1>Shopkeeper Login</h1>

            <p>
                Login to manage your shop
            </p>


            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter shopkeeper email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                    class="start-btn"
                >
                    Login
                </button>

            </form>


            <p class="signup-text">
                Shopkeeper account only
            </p>

        </div>

    </main>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Firebase login will be connected next 🔥");

            });

    </script>

</body>
</html>
